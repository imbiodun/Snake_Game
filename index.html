<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        function generateFood(tiles) {
                        return Math.floor(Math.random() * tiles);
                        }

        // ===== INITIAL STATE =====
        let gameRunning;
        let gameOver;
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 15, y: 15 };
        let score = 0;
        // ===== DRAWING =====
        
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================
        let gameSpeed = 120; // milliseconds
        let direction = { x: 1, y: 0 };
        let nextDirection = {x:1, y:0};
        let scoreTag = document.getElementById('info');
        function hasHitWall(head) {
            return (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            );
        }

       function hitsSelf(head) {
    return snake.some(segment => 
    
        segment.x === head.x && segment.y === head.y)}
        
        

        function gameStep() {
            direction = nextDirection;
            //Move the snake
            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            }
            
            function eatFood(){
                let val = false
                if((newHead.x === food.x) &&(newHead.y ===food.y) ){
                    score +=1;
                food.x= generateFood(tileCount);
                food.y= generateFood(tileCount);
                val = true;
                } 
                return val;
            }

            if (hasHitWall(newHead) || hitsSelf(newHead)) {
                clearInterval(gameInterval);
                scoreTag.textContent = `Game over! your score was ${score}`;
                return;
            }

            if (eatFood() === true){
                snake.unshift(newHead);
            }
            else{
            snake.pop();
            snake.unshift(newHead)
            }
            scoreTag.textContent = `Score: ${score}`
            drawGame();

            
        }
            

       let  gameInterval = setInterval(gameStep, gameSpeed);

    window.addEventListener('keydown',function(event){
       switch(event.key){
       case 'ArrowUp':
       case 'W':
       case 'w':
            if(direction.y === 0){
            nextDirection ={x:0, y:-1};
            }
            break;

        case 'ArrowDown':
        case 's':
        case 'S':
            if (direction.y ===0){
            nextDirection ={x:0, y:1};
            }
            break;

        case 'ArrowLeft':
        case 'a':
        case 'A':
            if (direction.x ===0){
            nextDirection ={x: -1, y:0};
            }
            break;

        case 'ArrowRight':
        case 'd':
        case 'D':
            if (direction.x ===0){
            nextDirection ={x:1, y:0};
            }
    }
    })
    </script>

</body>

</html>
