<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-shell">
        <header class="game-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">⌁</span>
                <div>
                    <h1>Snake</h1>
                    <p class="header-note">Use the arrow keys or WASD to move</p>
                </div>
            </div>
            <div class="score-pill">
                <span>Score</span>
                <strong id="score">0</strong>
                <small>Best <span id="highScore">0</span></small>
            </div>
        </header>

        <section class="game-content" aria-label="Snake game">
            <div class="board-wrap">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                <div class="game-over" id="gameOverPanel" aria-live="polite">
                    <div class="game-over-card">
                        <h2>Game over</h2>
                        <p id="finalScore">Your score was 0</p>
                        <button id="restartButton" type="button">Play again</button>
                    </div>
                </div>
                <div class="game-over" id="pausePanel" aria-live="polite">
                    <div class="game-over-card">
                        <h2>Game paused</h2>
                        <p>Your game is safely paused.</p>
                        <button id="resumeButton" type="button">Resume game</button>
                    </div>
                </div>
            </div>
        </section>

        <footer class="game-footer">
            <div class="controls">
                <span>Move</span>
                <kbd>↑</kbd>
                <kbd>↓</kbd>
                <kbd>←</kbd>
                <kbd>→</kbd>
            </div>
            <span>Space to pause · Enter to restart</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
